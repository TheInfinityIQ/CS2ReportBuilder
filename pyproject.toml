[project]
name = "cs2di"
version = "0.1.0"
description = "CS2 Demo Intelligence: evidence engine and Player Study product"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2", "pyarrow>=15", "scipy>=1.11"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
parse = ["demoparser2==0.42.0"]

[project.scripts]
cs2di = "cs2di.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"cs2di.report" = ["viewer.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
# Keep the project's core error checks stable across Ruff releases.
select = ["E4", "E7", "E9", "F"]
